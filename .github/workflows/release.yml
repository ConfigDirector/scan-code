name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: The version to release, such as v1.0.0. Its major tag, such as v1, moves to the same commit.
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Publish the release and move its major tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [[ ! "$VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The version is v followed by major.minor.patch, such as v1.0.0, not $VERSION."
            exit 1
          fi
          major="${VERSION%%.*}"

          notes=$(awk -v heading="## [${VERSION#v}]" '
            index($0, heading) == 1 { in_section = 1; next }
            in_section && /^## \[/ { exit }
            in_section { print }
          ' CHANGELOG.md)
          if [ -z "${notes//[[:space:]]/}" ]; then
            echo "::error::CHANGELOG.md has no entries under ## [${VERSION#v}]."
            exit 1
          fi

          released_commit=$(gh api "repos/$GH_REPO/git/ref/tags/$VERSION" --jq .object.sha 2>/dev/null || true)
          if [ -z "$released_commit" ]; then
            gh release create "$VERSION" --target "$GITHUB_SHA" --title "$VERSION" --notes "$notes"
            echo "Released $GITHUB_SHA as $VERSION"
          elif [ "$released_commit" = "$GITHUB_SHA" ]; then
            echo "$VERSION is already released at $GITHUB_SHA, moving $major only"
          else
            echo "::error::$VERSION is already released at $released_commit. Release the next version instead."
            exit 1
          fi

          if gh api "repos/$GH_REPO/git/ref/tags/$major" >/dev/null 2>&1; then
            gh api --method PATCH "repos/$GH_REPO/git/refs/tags/$major" -f sha="$GITHUB_SHA" -F force=true >/dev/null
          else
            gh api "repos/$GH_REPO/git/refs" -f ref="refs/tags/$major" -f sha="$GITHUB_SHA" >/dev/null
          fi
          echo "Moved $major to $GITHUB_SHA"
